<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smallServices</title>
  </head>
  <body>
    <div id="root"></div>


    <script>
      // الهدف: تطبيق الثيم واللغة المحفوظين في الكوكيز أو المستخرجة من URL قبل تحميل تطبيق React لتجنب وميض الثيم الافتراضي
      (() => {
        try {
          // ⚠️ كود إجباري ولا يوجد له بديل حالياً:
          // 🧠 استخراج الكوكيز المحفوظ بواسطة redux-persist
          const match = document.cookie.match(/settings=([^;]+)/);

          let theme = 'light';
          let lang = 'en';

          // 🌍 محاولة تحديد اللغة أولاً من شريط العنوان (URL)
          const pathLang = window.location.pathname.split('/')[1]; // يأخذ أول جزء بعد "/"
          const supportedLangs = ['ar', 'en', 'fr']; // أضف اللغات المدعومة هنا

          if (supportedLangs.includes(pathLang)) {
            lang = pathLang;
          } else if (match) {
            // إذا لم يتم تحديد اللغة من URL، استخدم الكوكيز
            const settings = JSON.parse(decodeURIComponent(match[1]));
            theme = settings?.theme?.replace(/"/g, '') || 'light';
            lang = settings?.language?.replace(/"/g, '') || 'en';
          } else {
            // لا لغة في الرابط ولا كوكيز
            lang = 'en';
            theme = 'light';
          }

          // 🌙 تطبيق الثيم فوراً
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;

          // 🈶 تعيين اللغة على مستوى الـ HTML لتجنب وميض النصوص
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        } catch (err) { console.warn('Preload settings failed:', err); }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
