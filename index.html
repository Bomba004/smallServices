<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smallServices</title>
  </head>
  <body>
    <div id="root"></div>


    <script>
      // الهدف: تطبيق الثيم واللغة المحفوظين في الكوكيز قبل تحميل تطبيق React لتجنب وميض الثيم الافتراضي
      (() => {
        try {
          // 🧠 استخراج الكوكيز المحفوظ بواسطة redux-persist
          const match = document.cookie.match(/settings=([^;]+)/);

          let theme = 'light';
          let lang = 'en';

          if (match) {
            // الكوكيز يحتوي على JSON مضغوط
            const settings = JSON.parse(decodeURIComponent(match[1]));
            // console.log('settings: ', settings);
            // 🔧 معالجة القيم (قد تحتوي على علامات تنصيص)
            theme = settings?.theme?.replace(/"/g, '') || 'light';
            lang = settings?.language?.replace(/"/g, '') || 'en';
          }

          // 🌙 تطبيق الثيم فوراً
          document.documentElement.setAttribute('data-theme', theme);
          // document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light');
          document.documentElement.style.colorScheme = theme;

          // 🈶 تعيين اللغة على مستوى الـ HTML لتجنب وميض النصوص
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'

        } catch (err) { console.warn('Preload settings failed:', err); }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
